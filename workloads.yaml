    requests:
      - name: gpu
        exactly:
          deviceClassName: gpu.example.com
---
apiVersion: v1
kind: Pod
metadata:
  name: gpu-workload-1
  namespace: gpu-lab
  labels:
    app: gpu-workload
spec:
  containers:
    - name: workload
      image: ubuntu:24.04
      command:
        - bash
        - -c
      args:
        - |
          echo "Simulated GPU workload 1 started"
          echo "DRA ResourceClaim: gpu-claim-1"
          sleep 1800
      resources:
        claims:
          - name: gpu

  resourceClaims:
    - name: gpu
      resourceClaimName: gpu-claim-1
---
