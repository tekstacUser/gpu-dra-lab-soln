apiVersion: v1
kind: Namespace
metadata:
  name: dra-tutorial
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dra-example-driver-service-account
  namespace: dra-tutorial
  labels:
    app.kubernetes.io/name: dra-example-driver
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dra-example-driver-role
rules:
  - apiGroups:
      - resource.k8s.io
    resources:
      - resourceclaims
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
  - apiGroups:
      - resource.k8s.io
    resources:
      - resourceslices
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dra-example-driver-role-binding
subjects:
  - kind: ServiceAccount
    name: dra-example-driver-service-account
    namespace: dra-tutorial
roleRef:
  kind: ClusterRole
  name: dra-example-driver-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: dra-driver-high-priority
value: 1000000
globalDefault: false
description: "High priority for DRA driver components"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dra-example-driver-kubeletplugin
  namespace: dra-tutorial
  labels:
    app.kubernetes.io/name: dra-example-driver
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dra-example-driver
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dra-example-driver
    spec:
      priorityClassName: dra-driver-high-priority
      serviceAccountName: dra-example-driver-service-account

      containers:
        - name: plugin
          image: registry.k8s.io/dra-example-driver/dra-example-driver:v0.2.0
          imagePullPolicy: IfNotPresent

          command:
            - dra-example-kubeletplugin

          securityContext:
            privileged: true

          env:
            - name: CDI_ROOT
              value: /var/run/cdi

            - name: KUBELET_REGISTRAR_DIRECTORY_PATH
              value: /var/lib/kubelet/plugins_registry

            - name: KUBELET_PLUGINS_DIRECTORY_PATH
              value: /var/lib/kubelet/plugins

            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

            # Simulated GPU capacity
            - name: NUM_DEVICES
              value: "3"

            - name: HEALTHCHECK_PORT
              value: "51515"

          volumeMounts:
            - name: plugins-registry
              mountPath: /var/lib/kubelet/plugins_registry

            - name: plugins
              mountPath: /var/lib/kubelet/plugins

            - name: cdi
              mountPath: /var/run/cdi

      volumes:
        - name: plugins-registry
          hostPath:
            path: /var/lib/kubelet/plugins_registry

        - name: plugins
          hostPath:
            path: /var/lib/kubelet/plugins

        - name: cdi
          hostPath:
            path: /var/run/cdi